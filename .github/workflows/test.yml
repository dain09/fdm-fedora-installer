name: CI Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run every Sunday at midnight UTC to verify upstream binary availability
    - cron: '0 0 * * 0'

jobs:
  lint:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'

  test-matrix:
    name: Fedora ${{ matrix.version }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [ "latest", "41", "40" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Test Installer & Full Lifecycle
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fedora:${{ matrix.version }} \
            /bin/bash -c "
              set -e
              echo '==> 1. Testing Help & Version Flags...'
              chmod +x install.sh update.sh uninstall.sh
              ./install.sh --help
              ./install.sh --version
              ./update.sh --help
              ./update.sh --version
              ./uninstall.sh --help
              ./uninstall.sh --version

              echo '==> 2. Running Full Installation with Autostart...'
              ./install.sh --autostart

              echo '==> 3. Verifying Core Executables, Symlinks & Browser Manifests...'
              test -f /opt/freedownloadmanager/wenativehost
              test -f /opt/freedownloadmanager/fdm
              test -f /usr/local/bin/fdm
              test -f /usr/local/bin/fdm-update
              test -f /usr/local/bin/fdm-doctor
              test -f /usr/share/applications/freedownloadmanager.desktop
              test -f \"\$HOME/.mozilla/native-messaging-hosts/org.freedownloadmanager.fdm5.cnh.json\"
              test -f \"\$HOME/.librewolf/native-messaging-hosts/org.freedownloadmanager.fdm5.cnh.json\"
              test -f \"\$HOME/.floorp/native-messaging-hosts/org.freedownloadmanager.fdm5.cnh.json\"

              echo '==> 4. Testing System Doctor Diagnosis...'
              ./install.sh --doctor

              echo '==> 5. Testing Update Script (Check, Smart & Force)...'
              ./update.sh --check
              ./update.sh
              ./update.sh --force
              test -f /usr/local/bin/fdm

              echo '==> 6. Testing Clean Removal...'
              ./uninstall.sh --yes
              test ! -d /opt/freedownloadmanager
              test ! -f /usr/local/bin/fdm
              test ! -f /usr/local/bin/fdm-update
              test ! -f /usr/local/bin/fdm-doctor
              
              echo '==> All CI checks passed successfully!'
            "
