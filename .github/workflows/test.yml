name: Test Installer on Fedora

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-fedora:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [ "latest", "43" ]
    container:
      image: fedora:${{ matrix.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Installation
        run: |
          chmod +x install.sh update.sh uninstall.sh
          ./install.sh

      - name: Verify Binary & Native Host
        run: |
          test -f /opt/freedownloadmanager/wenativehost || exit 1
          test -f /opt/freedownloadmanager/fdm || exit 1
          test -f "$HOME/.mozilla/native-messaging-hosts/org.freedownloadmanager.fdm5.cnh.json" || exit 1

      - name: Test Update Script
        run: ./update.sh

      - name: Test Uninstallation
        run: |
          ./uninstall.sh
          test ! -d /opt/freedownloadmanager || exit 1
