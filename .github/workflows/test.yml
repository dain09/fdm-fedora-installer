name: Test Installer on Fedora

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-fedora:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [ "latest", "43" ]
    container:
      image: fedora:${{ matrix.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Installer
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Verify Installation Files
        run: |
          test -f /opt/freedownloadmanager/wenativehost || exit 1
          test -f /opt/freedownloadmanager/fdm || exit 1
          echo "Installation verified successfully!"
