name: CI Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-matrix:
    name: Fedora ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [ "latest", "43" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Test Installer & Full Lifecycle
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fedora:${{ matrix.version }} \
            /bin/bash -c "
              set -e
              echo '==> 1. Running Installation...'
              chmod +x install.sh update.sh uninstall.sh
              ./install.sh

              echo '==> 2. Verifying Core Executables & Manifests...'
              test -f /opt/freedownloadmanager/wenativehost
              test -f /opt/freedownloadmanager/fdm
              test -f /usr/share/applications/freedownloadmanager.desktop

              echo '==> 3. Testing Update Script...'
              ./update.sh

              echo '==> 4. Testing Clean Removal...'
              ./uninstall.sh
              test ! -d /opt/freedownloadmanager
              
              echo '==> All checks passed!'
            "
